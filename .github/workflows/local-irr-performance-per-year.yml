name: Local PP macOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - local/6053_IRR

jobs:
  build:
    name: Build and package macOS ARM64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache Maven artifacts
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-mvn-${{ hashFiles('**/pom.xml', '**/*.target') }}
          restore-keys: |
            ${{ runner.os }}-mvn-

      - name: Set up Zulu JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Maven 3.9.16
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.16

      - name: Build and test
        run: |
          mvn verify \
            --batch-mode \
            --file portfolio-app/pom.xml

      - name: Package macOS ARM64 app
        run: |
          APP="$(find portfolio-product/target/products -type d -path '*/macosx/cocoa/aarch64/PortfolioPerformance.app' -print -quit)"
          test -n "$APP"
          echo "Packaging $APP"
          tar -C "$(dirname "$APP")" -czf PortfolioPerformance-6053-IRR-macos-aarch64.tar.gz PortfolioPerformance.app

      - name: Upload macOS ARM64 app
        uses: actions/upload-artifact@v4
        with:
          name: PortfolioPerformance-6053-IRR-macos-aarch64
          path: PortfolioPerformance-6053-IRR-macos-aarch64.tar.gz
          if-no-files-found: error
