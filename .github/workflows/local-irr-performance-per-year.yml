name: Local PP macOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - local/6053_IRR

jobs:
  build:
    name: Build and package macOS ARM64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Cache Maven artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-mvn-${{ hashFiles('**/pom.xml', '**/*.target') }}
          restore-keys: |
            ${{ runner.os }}-mvn-

      - name: Set up Zulu JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Maven 3.9.16
        uses: stCarolas/setup-maven@d6af6abeda15e98926a57b5aa970a96bb37f97d1 # v5
        with:
          maven-version: 3.9.16

      - name: Build and test
        run: |
          mvn verify \
            --batch-mode \
            -Ppackage-distro \
            --file portfolio-app/pom.xml

      - name: Package macOS ARM64 app
        run: |
          APP="$(find portfolio-product/target/products/name.abuchen.portfolio.distro.product -type d -path '*/macosx/cocoa/aarch64/PortfolioPerformance.app' -print -quit)"
          test -n "$APP"
          echo "Packaging $APP"
          tar -C "$(dirname "$APP")" -czf PortfolioPerformance-6053-IRR-distro-macos-aarch64.tar.gz PortfolioPerformance.app

      - name: Upload macOS ARM64 app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PortfolioPerformance-6053-IRR-distro-macos-aarch64
          path: PortfolioPerformance-6053-IRR-distro-macos-aarch64.tar.gz
          if-no-files-found: error
